# Single-container edge for local/compose use: serves the built SPA and
# reverse-proxies /api to the API service. (Production TLS variant lives in
# nginx.conf — blueprint §11.)
server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers (blueprint §3)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 10M;

  # API -> Express container
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploads -> Express container
  location /uploads/ {
    proxy_pass http://api:4000/uploads/;
    proxy_set_header Host $host;
  }

  # SPA static assets + client-side routing fallback
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
