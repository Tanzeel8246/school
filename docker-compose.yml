version: "3.9"

# Full Phase 1 stack: Postgres (auto schema+seed) + API + SPA-serving Nginx.
# Bring it up with:  docker compose up --build
# Then open http://localhost:8080  (API is proxied at /api by the web container).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: educore
      POSTGRES_USER: educore
      POSTGRES_PASSWORD: ${DB_PASSWORD:-educore}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./apps/api/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educore"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://educore:${DB_PASSWORD:-educore}@postgres:5432/educore
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    expose: ["4000"]
    ports: ["4000:4000"]
    volumes:
      - upload_data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated BullMQ worker — same image as the API, different entrypoint.
  # Scales independently; handles all SMS/WhatsApp/Email delivery jobs.
  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "dist/jobs/comms.worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://educore:${DB_PASSWORD:-educore}@postgres:5432/educore
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pg_data: {}
  redis_data: {}
  upload_data: {}
